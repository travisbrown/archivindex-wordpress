[graph]
all-features = true

[advisories]
version = 2

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A path dependency on a package that is never published cannot carry a version requirement,
# so the wildcard these crates resolve to has to be allowed.
allow-wildcard-paths = true

[licenses]
version = 2
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  # This workspace's own crates, and the WARC libraries they use.
  "GPL-3.0-only",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The core, WARC, and archiver libraries are consumed from their repositories until they are
# published.
allow-git = [
  "https://github.com/travisbrown/archivindex",
  "https://github.com/travisbrown/archivindex-warc",
  # The experimental backend needs the unreleased connection observer API.
  "https://github.com/travisbrown/wreq",
  # The fork requires unpublished btls APIs, pinned to the HTTP client's revision.
  "https://github.com/0x676e67/btls",
]
