[workspace]
members = ["crates/*", "tools/*"]
resolver = "3"

# The experimental backend requires the observer API, including through wreq-util.
[patch.crates-io]
wreq = { git = "https://github.com/travisbrown/wreq", rev = "da923c0a4fc7c17bee15c05624844deb719f8ff4" }
# Match the unpublished btls APIs required by the observer-enabled fork.
btls = { git = "https://github.com/0x676e67/btls", rev = "6659346432d4e0fb74eda53542e542de25f042e3" }
btls-sys = { git = "https://github.com/0x676e67/btls", rev = "6659346432d4e0fb74eda53542e542de25f042e3" }
tokio-btls = { git = "https://github.com/0x676e67/btls", rev = "6659346432d4e0fb74eda53542e542de25f042e3" }

[workspace.package]
authors = ["Travis Brown <travisrobertbrown@gmail.com>"]
repository = "https://github.com/travisbrown/archivindex-wordpress"
keywords = ["wordpress", "web", "archive"]
edition = "2024"
rust-version = "1.98"
readme = "README.md"
license = "GPL-3.0-only"
version = "0.1.0"

[workspace.dependencies]
archivindex-archiver = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex-warc" }
archivindex-cli-support = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex" }
archivindex-http = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex" }
archivindex-http-client = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex" }
archivindex-http-client-challenge = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex" }
archivindex-publication = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex" }
archivindex-test-support = { git = "https://github.com/travisbrown/archivindex" }
archivindex-warc = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex-warc", default-features = false }
archivindex-warc-linter = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex-warc" }
archivindex-warc-ops = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex-warc" }
archivindex-wordpress-model = { version = "0.1.0", path = "crates/model" }
archivindex-wordpress-scraper = { version = "0.1.0", path = "crates/scraper" }
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["miniz_oxide"] }
humantime = "2"
indicatif = "0.18"
log = "0.4"
proptest = { version = "1.11", features = ["attr-macro"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
url = "2"
# Match the experimental backend's observer-enabled fork.
wreq = { version = "=0.16.1", default-features = false }

[workspace.lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
