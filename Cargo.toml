[workspace]
members = ["crates/*", "tools/*"]
resolver = "3"

# The experimental backend requires the observer API, including through wreq-util.
[patch.crates-io]
wreq = { git = "https://github.com/travisbrown/wreq", rev = "bdb34167f759ec7dc62b5b73986fa30b2497be9d" }
wreq-util = { git = "https://github.com/travisbrown/wreq-util", rev = "69af0555e88cb2882de7a4250a40a828d7eb9a61" }
# Match the TLS and HTTP codec APIs required by the HTTP client.
btls = { git = "https://github.com/0x676e67/btls", rev = "2acfbfe3240d799112eed51637cf9b01eec5ad25" }
btls-sys = { git = "https://github.com/0x676e67/btls", rev = "2acfbfe3240d799112eed51637cf9b01eec5ad25" }
tokio-btls = { git = "https://github.com/0x676e67/btls", rev = "2acfbfe3240d799112eed51637cf9b01eec5ad25" }
http2 = { git = "https://github.com/0x676e67/http2", rev = "ddb99c6db7222b1c3b9c72d1286b22b1dfb32918" }
# Later revisions require Rust 1.100.
netty = { git = "https://github.com/0x676e67/netty", rev = "52608f297fb53396e8a5fff5b6a286c1460f667a" }

[workspace.package]
authors = ["Travis Brown <travisrobertbrown@gmail.com>"]
repository = "https://github.com/travisbrown/archivindex-wordpress"
keywords = ["wordpress", "web", "archive"]
edition = "2024"
rust-version = "1.98"
readme = "README.md"
license = "GPL-3.0-only"
version = "0.1.0"

[workspace.dependencies]
archivindex-archiver = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex-warc" }
archivindex-cli-support = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex" }
archivindex-http = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex" }
archivindex-http-client = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex" }
archivindex-http-client-challenge = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex" }
archivindex-publication = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex" }
archivindex-test-support = { git = "https://github.com/travisbrown/archivindex" }
archivindex-warc = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex-warc", default-features = false }
archivindex-warc-linter = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex-warc" }
archivindex-warc-ops = { version = "0.1.0", git = "https://github.com/travisbrown/archivindex-warc" }
archivindex-wordpress-model = { version = "0.1.0", path = "crates/model" }
archivindex-wordpress-scraper = { version = "0.1.0", path = "crates/scraper" }
clap = { version = "4.5", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["miniz_oxide"] }
indicatif = "0.18"
jiff = { version = "1", default-features = false, features = ["std"] }
proptest = { version = "1.11", features = ["attr-macro"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
url = "2"
# Match the experimental backend's observer-enabled fork.
wreq = { version = "=0.16.1", default-features = false }

[workspace.lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
