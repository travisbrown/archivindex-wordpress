[package]
name = "archivindex-wordpress-scraper-cli"
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "archivindex-wordpress-scraper"
path = "src/main.rs"
doc = false

[features]
# Compile SQLite from source rather than linking the system library.
bundled = ["archivindex-archiver/bundled"]
# Browser-derived TLS emulation. Requires Rust 1.98 and builds BoringSSL from source.
wreq = ["dep:archivindex-http-client", "archivindex-http-client/wreq", "dep:tokio", "dep:wreq"]

[dependencies]
archivindex-archiver.workspace = true
archivindex-cli-support.workspace = true
archivindex-http-client = { workspace = true, optional = true }
archivindex-http-client-challenge.workspace = true
archivindex-warc = { workspace = true, features = ["gzip"] }
archivindex-warc-linter.workspace = true
archivindex-warc-ops.workspace = true
archivindex-wordpress-scraper.workspace = true
chrono.workspace = true
clap.workspace = true
humantime.workspace = true
indicatif.workspace = true
log.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
url.workspace = true
wreq = { workspace = true, optional = true, features = ["gzip", "brotli", "deflate", "zstd"] }

[dev-dependencies]
archivindex-test-support.workspace = true
flate2.workspace = true
tempfile.workspace = true
